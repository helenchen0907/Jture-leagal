<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jture - Contact Us</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            background: white;
            border-radius: 1.5rem;
            padding: 3rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 700;
            color: #0ea5e9;
            margin-bottom: 0.5rem;
        }

        .tagline {
            color: #64748b;
            font-size: 1rem;
            margin-bottom: 2rem;
        }

        .message {
            color: #1e293b;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 1.5rem;
        }

        .email-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #0ea5e9 0%, #7dd3fc 100%);
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 2rem;
            font-size: 1.1rem;
            font-weight: 500;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .email-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(14, 165, 233, 0.4);
        }

        .footer {
            margin-top: 2rem;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .footer a {
            color: #86868B;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 640px) {
            .container {
                padding: 2rem;
            }

            .logo {
                font-size: 2rem;
            }

            .email-link {
                padding: 0.875rem 1.5rem;
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Jture</div>
        <p class="tagline">AI-Powered Job Application Assistant</p>
        <p class="message">If you have any questions, feedback, or need assistance, please feel free to contact us.</p>
        <a href="mailto:jturehelp@gmail.com" class="email-link">
            📧 jturehelp@gmail.com
        </a>
        <div class="footer">
            <p>© 2026 Jture. All rights reserved.</p>
            <p><a href="https://beian.miit.gov.cn/" target="_blank">粤ICP备2026011344号-1A</a></p>
        </div>
    </div>
</body>
</html>
